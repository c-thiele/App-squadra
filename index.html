<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Malo"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#f1f4f0"><meta name="color-scheme" content="light">
<title>U.S. Malo</title>
<style>
:root{--bg:#f1f4f0;--card:#fff;--tx:#14201a;--mu:#5f6e65;--ac:#14532d;--on:#fff;--bd:#d7ded8;--bo:#0e1a14;--bt:#f1f4f0;--V:#1f7a45;--N:#8a7a1e;--P:#b3372b;--am:#d99a1e;--gr:#d5ebd8;--ln:#3f6b4f;--zt:#14532d;--hm:#e0701a}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
main{padding:12px;max-width:760px;margin:auto}
h2,h3,h4,h5{margin:0 0 8px}h4{font-size:16px}h5{font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.line+.line{border-top:1px solid var(--bd)}
.mu,small{color:var(--mu)}.tap{cursor:pointer}
.board{background:var(--bo);color:var(--bt);border-radius:10px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-around;text-align:center}
.board b{display:block;font-size:38px;line-height:1;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-1px}
.board span{font-size:12px;opacity:.7}
.board .big{font-size:56px}
.chip{display:inline-block;min-width:30px;text-align:center;padding:3px 8px;border-radius:6px;color:#fff;font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.chip.V{background:var(--V)}.chip.N{background:var(--N)}.chip.P{background:var(--P)}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:var(--on);cursor:pointer;margin:0 6px 8px 0}
button.b2{background:transparent;color:var(--ac);border:1px solid var(--ac)}button.red{color:var(--P);border-color:var(--P)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--am);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
input,select{display:block;width:100%;font:16px system-ui;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
input[type=checkbox]{width:22px;height:22px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:7px 5px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mu);font-weight:600}tr[onclick]{cursor:pointer}
.bar{display:grid;grid-template-columns:90px 1fr 24px;align-items:center;gap:8px;font-size:13px;padding:2px 0}.bar i{display:block;height:8px;border-radius:4px;background:var(--ac)}.bar b{text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;margin:0;border-radius:0;background:transparent;color:var(--mu);padding:14px 2px}nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.row{display:flex;flex-wrap:wrap}
.pitch{width:100%;height:auto;display:block}.zr{fill:var(--hm);fill-opacity:var(--o,0);stroke:var(--ln);stroke-width:2;cursor:pointer}.sel .zr{fill-opacity:.9;stroke:var(--tx);stroke-width:5}.pitch text{fill:var(--zt);text-anchor:middle;pointer-events:none;font-family:system-ui;font-weight:700}
.hero{background:var(--bo);color:var(--bt);border-radius:12px;padding:22px 18px;margin-bottom:12px}.hero h1{margin:0;font-size:30px;letter-spacing:-.5px}.hero span{opacity:.7}.hero{display:flex;align-items:center;gap:16px}.hero img{height:84px;width:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:104px;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-left:6px solid var(--ac);border-radius:10px;padding:14px;margin:0;text-decoration:none;font:inherit;cursor:pointer}.tile b{font-size:17px}.tile small{color:var(--mu)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}.top h2{margin:0 0 8px;font-size:20px}
nav:empty{display:none}
.wide,.foto{grid-column:1/-1}
.foto{min-height:120px;aspect-ratio:2.6/1;max-height:210px;justify-content:flex-end;background-color:#1d2b23;background-image:linear-gradient(to top,#000b,#0002),var(--foto,none);background-size:cover;background-position:center}.foto b,.foto small{color:#fff;text-shadow:0 1px 4px #000c}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// Facoltativo: scrivi qui i due valori di Supabase per non doverli inserire su ogni dispositivo.
const CFG={u:'',k:''};

const $=s=>document.querySelector(s),app=$('#app'),nav=$('#nav');
let sb,D={g:[],p:[],pr:[],go:[]},tab='home',cur=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID().slice(0,8),today=()=>new Date().toISOString().slice(0,10);
const sum=(a,k)=>a.reduce((s,x)=>s+(+x[k]||0),0);
const played=p=>p.gol_fatti!=null&&p.gol_subiti!=null;
const res=p=>p.gol_fatti>p.gol_subiti?'V':p.gol_fatti<p.gol_subiti?'P':'N';
const gname=id=>D.g.find(x=>x.id===id)?.nome||'—';
const cfg=()=>CFG.u?CFG:JSON.parse(localStorage.getItem('cfg')||'null');

async function boot(){
  const c=cfg();if(!c)return setup();
  sb=supabase.createClient(c.u,c.k);
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return login();
  await load();render();loadFoto();
}
function setup(){
  nav.innerHTML='';
  app.innerHTML=`<form class="card" id="f"><h3>Collega il database</h3><label>Project URL<input name="u" required></label><label>Chiave anon (public)<input name="k" required></label><button>Salva</button></form>`;
  $('#f').onsubmit=e=>{e.preventDefault();localStorage.setItem('cfg',JSON.stringify({u:e.target.u.value.trim(),k:e.target.k.value.trim()}));boot()};
}
function login(){
  nav.innerHTML='';
  app.innerHTML=`<form class="card" id="f"><h3>Accedi</h3><label>Email<input name="e" type="email" required></label><label>Password<input name="p" type="password" required></label><button>Entra</button>${CFG.u?'':'<button type="button" class="b2" onclick="localStorage.removeItem(\'cfg\');boot()">Cambia database</button>'}</form>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:e.target.e.value,password:e.target.p.value});error?alert('Accesso non riuscito: '+error.message):boot()};
}
async function loadFoto(){
  const set=u=>document.documentElement.style.setProperty('--foto',`url("${u}")`);
  try{const{data}=await sb.storage.from('media').createSignedUrl('squadra.jpg',3600);if(data?.signedUrl)return set(data.signedUrl)}catch(e){}
  const im=new Image();im.onload=()=>set('squadra.jpg');im.src='squadra.jpg';
}
async function load(){
  const r=await Promise.all(['giocatori','partite','presenze','gol'].map(t=>sb.from(t).select('*').range(0,9999)));
  const e=r.find(x=>x.error);if(e)alert('Impossibile leggere i dati: '+e.error.message);
  [D.g,D.p,D.pr,D.go]=r.map(x=>x.data||[]);
  D.p.sort((a,b)=>(a.giornata||0)-(b.giornata||0));D.g.sort((a,b)=>a.nome.localeCompare(b.nome));
}
async function db(op){const{error}=await op;if(error)alert('Salvataggio non riuscito: '+error.message);await load();render()}

function pstats(id){
  const r=D.pr.filter(x=>x.giocatore_id===id);
  return{pres:r.filter(x=>x.stato!=='Non entrato').length,tit:r.filter(x=>x.stato==='Titolare').length,min:sum(r,'minuti'),ass:sum(r,'assist'),gi:r.filter(x=>x.giallo).length,ro:r.filter(x=>x.rosso).length,gol:D.go.filter(x=>x.giocatore_id===id&&x.tipo==='FATTO').length};
}

function stat(){
  const P=D.p.filter(played),t={V:0,N:0,P:0,gf:0,gs:0};
  P.forEach(p=>{t[res(p)]++;t.gf+=p.gol_fatti;t.gs+=p.gol_subiti});
  const sc=D.g.map(g=>({n:g.nome,v:pstats(g.id).gol})).filter(x=>x.v).sort((a,b)=>b.v-a.v).slice(0,5);
  const d=t.gf-t.gs;
  return`<div class="board"><div><b>${t.V}</b><span>vinte</span></div><div><b>${t.N}</b><span>pareggi</span></div><div><b>${t.P}</b><span>perse</span></div></div>
  <div class="board"><div><b>${t.gf}</b><span>gol fatti</span></div><div><b>${t.gs}</b><span>gol subiti</span></div><div><b>${d>0?'+':''}${d}</b><span>differenza</span></div></div>
  <div class="card"><h4>Ultime partite</h4>${P.slice(-5).map(p=>`<span class="chip ${res(p)}">${res(p)}</span>`).join('')||'<span class="mu">Nessuna partita giocata.</span>'}</div>
  <div class="card"><h4>Marcatori</h4>${sc.map(x=>`<div class="line"><span>${esc(x.n)}</span><b>${x.v}</b></div>`).join('')||'<span class="mu">Ancora nessun gol.</span>'}</div>`;
}

function partite(){
  return`<button onclick="editP()">Nuova partita</button>`+D.p.map(p=>`<div class="card tap" onclick="cur='${p.id}';render()"><div class="line"><b>${esc(p.avversario)}</b>${played(p)?`<span class="chip ${res(p)}">${p.gol_fatti}-${p.gol_subiti}</span>`:''}</div><small>Giornata ${p.giornata??'-'}, ${p.data||'data da definire'}, ${p.casa_trasferta==='CASA'?'in casa':'in trasferta'}</small></div>`).join('');
}
function detail(){
  const p=D.p.find(x=>x.id===cur);if(!p){cur=null;return partite()}
  const pr=D.pr.filter(x=>x.partita_id===p.id).sort((a,b)=>(a.numero||99)-(b.numero||99));
  const go=D.go.filter(x=>x.partita_id===p.id).sort((a,b)=>(a.tempo==='ST')-(b.tempo==='ST')||a.minuto-b.minuto);
  return`<button class="b2" onclick="cur=null;render()">Torna alle partite</button><button class="b2" onclick="editP('${p.id}')">Modifica partita</button>
  <div class="board"><div><b class="big">${p.gol_fatti??'-'}</b><span>noi</span></div><div><b class="big">${p.gol_subiti??'-'}</b><span>${esc(p.avversario)}</span></div></div>
  <div class="card"><div class="line"><h4>Gol</h4><button class="b2" onclick="editGol('${p.id}')">Aggiungi gol</button></div>${go.map(x=>`<div class="line tap" onclick="editGol('${p.id}','${x.id}')"><span>${x.minuto??''}' ${x.tempo||''}, ${x.tipo==='FATTO'?esc(gname(x.giocatore_id)):'subito'}</span><small>${[x.modo,x.zona,x.origine].filter(Boolean).join(', ')}</small></div>`).join('')||'<span class="mu">Nessun gol registrato.</span>'}</div>
  <div class="card"><div class="line"><h4>Formazione</h4><button class="b2" onclick="editPr('${p.id}')">Aggiungi giocatore</button></div>${pr.map(x=>`<div class="line tap" onclick="editPr('${p.id}','${x.id}')"><span>${x.numero??''} ${esc(gname(x.giocatore_id))}</span><small>${x.stato}, ${x.minuti}'${x.giallo?', giallo':''}${x.rosso?', rosso':''}${x.assist?', assist '+x.assist:''}</small></div>`).join('')||'<span class="mu">Nessun giocatore inserito.</span>'}</div>`;
}
function giocatori(){
  return`<button onclick="editG()">Nuovo giocatore</button><div class="card" style="overflow-x:auto"><table><tr><th>Giocatore</th><th>Pres</th><th>Tit</th><th>Min</th><th>% min</th><th>Gol</th><th>Ass</th><th>Gial</th><th>Ros</th></tr>${D.g.map(g=>{const s=pstats(g.id);return`<tr onclick="openG('${g.id}')"><td>${esc(g.nome)}<br><small>${esc(g.ruolo||'')}</small></td><td>${s.pres}</td><td>${s.tit}</td><td>${s.min}</td><td>${pct(s.min)}%</td><td>${s.gol}</td><td>${s.ass}</td><td>${s.gi}</td><td>${s.ro}</td></tr>`}).join('')}</table></div>`;
}
const ZR=[[1,272,18,168,68],[2,272,86,168,72],[3,175,18,97,68],[4,175,86,97,72],[5,440,18,97,68],[6,440,86,97,72],[7,8,18,167,140],[8,537,18,166,140],[9,8,160,238,106],[10,246,160,222,106],[11,468,160,235,106],[12,8,266,238,106],[13,246,266,222,106],[14,468,266,235,106],[15,8,372,695,195]];
const zn=z=>parseInt(String(z||'').replace(/\D/g,''))||0;
const zc=a=>{const c={};a.forEach(x=>{const n=zn(x.zona);if(n)c[n]=(c[n]||0)+1});return c};
function fieldSVG(c={},sel=0,num=true){
  const mx=Math.max(1,...Object.values(c));
  return`<svg class="pitch" viewBox="0 0 711 575" role="img" aria-label="Campo diviso in 15 zone"><rect width="711" height="575" rx="10" fill="var(--gr)"/><rect x="323" y="5" width="65" height="13" fill="none" stroke="var(--ln)" stroke-width="3"/><path d="M280 158A87 87 0 0 0 432 158M273 567A83 83 0 0 1 439 567M8 32A14 14 0 0 0 22 18M689 18A14 14 0 0 0 703 32" fill="none" stroke="var(--ln)" stroke-width="2"/><circle cx="356" cy="115" r="3.5" fill="var(--ln)"/><circle cx="356" cy="567" r="3.5" fill="var(--ln)"/>${ZR.map(([n,x,y,w,h])=>`<g data-z="${n}" class="${n===sel?'sel':''}"><rect class="zr" x="${x}" y="${y}" width="${w}" height="${h}" style="--o:${c[n]?(.2+.7*c[n]/mx).toFixed(2):0}"/>${!num?(c[n]?`<text x="${x+w/2}" y="${y+h/2+11}" font-size="32">${c[n]}</text>`:''):c[n]?`<text x="${x+w/2}" y="${y+h/2-6}" font-size="16" opacity=".75">${n}</text><text x="${x+w/2}" y="${y+h/2+24}" font-size="30">${c[n]}</text>`:`<text x="${x+w/2}" y="${y+h/2+9}" font-size="26" opacity=".8">${n}</text>`}</g>`).join('')}</svg>`;
}
const DUR=70;
const mAbs=x=>(x.tempo==='ST'?DUR/2:0)+(+x.minuto||0);
function minBars(a){
  const B=['1-10','11-20','21-30','31-40','41-50','51-60','61-70'],c=B.map(()=>0);
  a.forEach(x=>{const m=mAbs(x);if(m>0)c[Math.min(6,Math.floor((m-1)/10))]++});
  const mx=Math.max(1,...c);
  return'<h5>Minuto del gol</h5>'+B.map((b,i)=>`<div class="bar"><span>${b}'</span><i style="width:${c[i]/mx*100}%"></i><b>${c[i]}</b></div>`).join('');
}
const bars=(a,k,l)=>{const m={};a.forEach(x=>{const v=x[k]||'non indicato';m[v]=(m[v]||0)+1});const mx=Math.max(1,...Object.values(m));return`<h5>${l}</h5>`+Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="bar"><span>${esc(n)}</span><i style="width:${c/mx*100}%"></i><b>${c}</b></div>`).join('')};
const nPlayed=()=>D.p.filter(played).length;
const pct=m=>nPlayed()?Math.round(m/(nPlayed()*DUR)*100):0;
let curG=null;
function openG(id){curG=id;render();scrollTo(0,0)}
function scheda(){
  const g=D.g.find(x=>x.id===curG);if(!g){curG=null;return giocatori()}
  const s=pstats(g.id),gl=D.go.filter(x=>x.giocatore_id===g.id&&x.tipo==='FATTO');
  return`<button class="b2" onclick="curG=null;render()">Torna ai giocatori</button><button class="b2" onclick="editG('${g.id}')">Modifica</button>
  <div class="card"><h3>${esc(g.nome)}</h3><small>${esc(g.ruolo||'')}</small></div>
  <div class="board"><div><b>${s.pres}</b><span>presenze</span></div><div><b>${s.min}</b><span>minuti</span></div><div><b>${pct(s.min)}%</b><span>minuti giocati</span></div></div>
  <div class="board"><div><b>${s.gol}</b><span>gol</span></div><div><b>${s.ass}</b><span>assist</span></div><div><b>${s.tit}</b><span>da titolare</span></div></div>
  <div class="card"><small>La percentuale è calcolata su ${nPlayed()*DUR} minuti: ${nPlayed()} partite giocate da ${DUR} minuti.</small></div>
  <div class="card"><h4>Gol del giocatore</h4>${gl.length?bars(gl,'modo','Modo')+bars(gl,'origine','Origine'):'<span class="mu">Nessun gol segnato.</span>'}</div>`;
}
function analisi(ts){
  const bar=(a,k,l)=>{const m={};a.forEach(x=>{const v=x[k]||'non indicato';m[v]=(m[v]||0)+1});const mx=Math.max(1,...Object.values(m));return`<h5>${l}</h5>`+Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`<div class="bar"><span>${esc(n)}</span><i style="width:${c/mx*100}%"></i><b>${c}</b></div>`).join('')};
  return ts.map(t=>{const a=D.go.filter(x=>x.tipo===t);return`<div class="card"><h4>Gol ${t==='FATTO'?'fatti':'subiti'}: ${a.length}</h4>${a.length?'<h5>Zona</h5>'+fieldSVG(zc(a),0,false)+minBars(a)+bar(a,'tempo','Tempo')+bar(a,'modo','Modo')+bar(a,'origine','Origine'):'<span class="mu">Nessun dato.</span>'}</div>`}).join('');
}
function altro(){return`<div class="card"><button onclick="exp()">Esporta i dati</button><button class="b2" onclick="sb.auth.signOut().then(()=>location.reload())">Esci</button></div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));a.download='squadra-'+today()+'.json';a.click()}

const TEAM='U.S. Malo',SEASON='Stagione 2026/2027',CONV='https://c-thiele.github.io/App-Malo/convocazioni.html';
function menu(){
  const t={V:0,N:0,P:0};D.p.filter(played).forEach(p=>t[res(p)]++);
  const n=k=>D.go.filter(x=>x.tipo===k).length;
  const c=[['giocatori','Giocatori',D.g.length+' in rosa'],['partite','Partite',D.p.length+' in archivio'],['stat','Statistiche squadra',`${t.V}V ${t.N}N ${t.P}P`],['fatti','Analisi gol fatti',n('FATTO')+' gol'],['subiti','Analisi gol subiti',n('SUBITO')+' gol']];
  return`<div class="grid">${c.map(([k,a,s])=>`<button class="tile${k==='giocatori'?' foto':''}" onclick="goTo('${k}')"><b>${a}</b><small>${s}</small></button>`).join('')}<a class="tile wide" href="${CONV}" target="_blank" rel="noopener"><b>Convocazioni</b><small>Apri il modulo</small></a></div><div class="row" style="margin-top:16px"><button class="b2" onclick="exp()">Esporta i dati</button><button class="b2" onclick="sb.auth.signOut().then(()=>location.reload())">Esci</button></div>`;
}
const T={home:['Home',menu],partite:['Partite',()=>cur?detail():partite()],giocatori:['Giocatori',()=>curG?scheda():giocatori()],stat:['Statistiche squadra',stat],fatti:['Analisi gol fatti',()=>analisi(['FATTO'])],subiti:['Analisi gol subiti',()=>analisi(['SUBITO'])]};
function goTo(k){tab=k;cur=null;curG=null;render();scrollTo(0,0)}
let last='';const sig=()=>tab+'|'+cur+'|'+curG;
function render(){
  if(sig()!==last){const st={tab,cur,curG};last?history.pushState(st,''):history.replaceState(st,'');last=sig()}
  nav.innerHTML=[['home','Home'],['partite','Partite'],['giocatori','Giocatori']].map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="goTo('${k}')">${v}</button>`).join('');
  app.innerHTML=(tab==='home'?`<div class="hero"><img src="stemma.png" alt="Stemma U.S. Malo"><div><h1>${TEAM}</h1><span>${SEASON}</span></div></div>`:`<div class="top"><button class="b2" onclick="goTo('home')">‹ Home</button><h2>${T[tab][0]}</h2></div>`)+T[tab][1]();
}

function form(title,fields,vals,onSave,onDel){
  const m=document.createElement('div');m.className='modal';
  let open=true;const closeM=()=>{if(open){open=false;m.remove();history.back()}};history.pushState({tab,cur,curG,m:1},'');
  const inp=f=>f[2]==='zone'?`<input type="hidden" name="${f[0]}" value="${esc(vals[f[0]])}">${fieldSVG({},zn(vals[f[0]]))}`:f[2]==='select'?`<select name="${f[0]}">${f[3].map(o=>{const[v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}"${String(vals[f[0]]??'')===String(v)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`:f[2]==='check'?`<input type="checkbox" name="${f[0]}"${vals[f[0]]?' checked':''}>`:`<input name="${f[0]}" type="${f[2]}" value="${esc(vals[f[0]])}">`;
  m.innerHTML=`<form class="sheet"><h3>${title}</h3>${fields.map(f=>`<label>${f[1]}${inp(f)}</label>`).join('')}<div class="row"><button>Salva</button><button type="button" class="b2" id="x">Annulla</button>${onDel?'<button type="button" class="b2 red" id="d">Elimina</button>':''}</div></form>`;
  document.body.append(m);
  m.querySelector('#x').onclick=()=>closeM();
  m.querySelectorAll('[data-z]').forEach(g=>g.onclick=()=>{const i=m.querySelector('[name=zona]'),v='ZONA '+g.dataset.z,on=i.value!==v;i.value=on?v:'';m.querySelectorAll('[data-z]').forEach(k=>k.classList.remove('sel'));if(on)g.classList.add('sel')});
  if(onDel)m.querySelector('#d').onclick=async()=>{if(confirm('Eliminare in modo definitivo?')){await onDel();closeM()}};
  m.querySelector('form').onsubmit=async e=>{e.preventDefault();const o={};fields.forEach(f=>{const el=e.target.elements[f[0]];o[f[0]]=f[2]==='check'?el.checked:el.value===''?null:f[2]==='number'?+el.value:el.value});await onSave(o);closeM()};
}
